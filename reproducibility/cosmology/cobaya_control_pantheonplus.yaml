# Cobaya configuration: w0-wa CPL — SN-OVERLAP CONTROL A (Pantheon+-ONLY)
# Project: Golden (2026), BigBounce P1B — DESI DR2 quintom-B robustness control
#
# WHY: P1B's quintom-B cross-check used a combined SN likelihood in which
# DES-Y5 and Pantheon+ share supernovae (double-counting). Reviewers
# (ChatGPT-B1, recurring blocker; 4/6 reviewers) require CONTROL CHAINS
# proving the w0wa direction (w0 > -1, w0+wa < -1) is robust to the SN
# sample and is NOT an artifact of double-counted SNe.
#
# CONTROL A: Planck NPIPE + SDSS DR16 BAO + Pantheon+-ONLY SN, w0wa CPL.
# Compare to CONTROL B (DES-Y5-only, cobaya_control_desy5.yaml).
# Deliverable: w0, wa, w0+wa posteriors -> is the quintom-B direction
# consistent across the two INDEPENDENT SN samples?
#
# Derived from the validated cobaya_w0wa_quintom_test.yaml (same priors,
# sampler, CPL+PPF params); ONLY the SN likelihood and output path differ.
#
# Run (MPI, recommended): mpirun --allow-run-as-root -n 6 cobaya-run cobaya_control_pantheonplus.yaml --resume
# Prereqs: cobaya==3.5.4 + cobaya-install cosmo (Planck NPIPE clik + Pantheon+ data).

likelihood:
  # --- CMB: Planck 2018 NPIPE ---
  planck_2018_lowl.TT:
  planck_2018_lowl.EE:
  planck_NPIPE_highl_CamSpec.TTTEEE:
  planck_2018_lensing.clik:
  # --- BAO: SDSS DR16 ---
  bao.sixdf_2011_bao:
  bao.sdss_dr7_mgs:
  bao.sdss_dr16_baoplus_lrg:
  bao.sdss_dr16_baoplus_qso:
  bao.sdss_dr16_baoplus_lyauto:
  bao.sdss_dr16_baoplus_lyxqso:
  # --- Supernovae: Pantheon+ ONLY (control A: no DES-Y5, no double-count) ---
  sn.pantheonplus:

theory:
  camb:
    path: null
    extra_args:
      lens_potential_accuracy: 1
      num_massive_neutrinos: 1
      theta_H0_range: [40, 100]
      # CPL dark energy with PPF crossing handler (correct across w=-1)
      dark_energy_model: ppf

sampler:
  mcmc:
    burn_in: 0.3
    max_tries: 40d
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2
    learn_proposal: true
    learn_proposal_Rminus1_max: 30
    proposal_scale: 2.4
    oversample_power: 0.4
    drag: true

params:
  # --- Standard LCDM parameters ---
  logA:
    prior: {min: 1.61, max: 3.91}
    ref: {dist: norm, loc: 3.044, scale: 0.014}
    proposal: 0.001
    latex: \log(10^{10} A_s)
    drop: true
  As:
    value: "lambda logA: 1e-10*np.exp(logA)"
    latex: A_s
  ns:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 0.9649, scale: 0.0042}
    proposal: 0.002
    latex: n_s
  theta_MC_100:
    prior: {min: 0.5, max: 10}
    ref: {dist: norm, loc: 1.04092, scale: 0.00031}
    proposal: 0.0002
    latex: 100\theta_{MC}
    drop: true
    renames: theta
  cosmomc_theta:
    value: "lambda theta_MC_100: 1.e-2*theta_MC_100"
    derived: false
  H0:
    latex: H_0 \; [\mathrm{km/s/Mpc}]
    min: 40
    max: 100
  ombh2:
    prior: {min: 0.005, max: 0.1}
    ref: {dist: norm, loc: 0.02237, scale: 0.00015}
    proposal: 0.0001
    latex: \Omega_b h^2
  omch2:
    prior: {min: 0.001, max: 0.99}
    ref: {dist: norm, loc: 0.1200, scale: 0.0012}
    proposal: 0.0005
    latex: \Omega_c h^2
  tau:
    prior: {min: 0.01, max: 0.8}
    ref: {dist: norm, loc: 0.054, scale: 0.007}
    proposal: 0.003
    latex: \tau_\mathrm{reio}

  # --- CPL dark energy equation of state: w(a) = w0 + wa*(1-a) ---
  w:
    prior: {min: -2.5, max: -0.3}
    ref: {dist: norm, loc: -0.85, scale: 0.1}
    proposal: 0.03
    latex: w_0
  wa:
    prior: {min: -3.0, max: 2.0}
    ref: {dist: norm, loc: -0.6, scale: 0.3}
    proposal: 0.08
    latex: w_a

  # --- Derived parameters ---
  sigma8:
    latex: \sigma_8
  S8:
    derived: "lambda sigma8, omegam: sigma8*np.sqrt(omegam/0.3)"
    latex: S_8
  omegam:
    latex: \Omega_m
  age:
    latex: '{\rm{Age}}/\mathrm{Gyr}'
  w_pivot:
    derived: "lambda w, wa: w + wa*(1.0 - 1.0/1.5)"
    latex: w(z{=}0.5)
  w0_plus_wa:
    derived: "lambda w, wa: w + wa"
    latex: w_0 + w_a

output: chains/control_pantheonplus/cpp
