[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "namaster-proof"
version = "0.1.1"
description = "Exact NaMaster window operators and content-addressed checkpoint receipts"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Houston Golden" },
]
keywords = ["cosmology", "namaster", "reproducibility", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
namaster-proof = "namaster_proof.cli:main"

[project.urls]
Repository = "https://github.com/Hubify-Projects/bigbounce"

[tool.hatch.build.targets.wheel]
packages = ["src/namaster_proof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
