theory:
  alp_theory.ALPBirefringence:
    f_a_eV: 2.435e+27
    C_agamma: 8.0
    Omega_m: 0.315
    input_params_defaults:
      theta_i: null
      log10_m_eV: null
    speed: -1
    stop_at_error: false
    version: null
    python_path: .
    input_params:
    - theta_i
    - log10_m_eV
    - C_agamma
    output_params:
    - beta_deg
    - eta
    - Omega_a
    - w_a_0
likelihood:
  birefringence_lk.BirefringenceLikelihood:
    beta_obs: 0.342
    sigma_beta: 0.094
    type: []
    speed: -1
    stop_at_error: false
    version: null
    python_path: .
    input_params: []
    output_params: []
params:
  theta_i:
    prior:
      min: 0.01
      max: 3.14159
    ref:
      dist: norm
      loc: 1.3
      scale: 0.3
    proposal: 0.2
    latex: \theta_i
  log10_m_eV:
    prior:
      min: -35
      max: -30
    ref:
      dist: norm
      loc: -31.5
      scale: 0.5
    proposal: 0.3
    latex: \log_{10}(m_a/\mathrm{eV})
  C_agamma:
    prior:
      min: 1
      max: 30
    ref:
      dist: norm
      loc: 8
      scale: 2
    proposal: 1.0
    latex: C_{a\gamma}
  beta_deg:
    latex: \beta\;[\mathrm{deg}]
    derived: true
  eta:
    latex: \eta
    derived: true
  Omega_a:
    latex: \Omega_a
    derived: true
  w_a_0:
    latex: w_a(z{=}0)
    derived: true
sampler:
  mcmc:
    sampler_type: mcmc
    supports_periodic_params: true
    burn_in: 0.3
    max_tries: 40d
    covmat: null
    covmat_params: null
    proposal_scale: 2.4
    output_every: 60s
    learn_every: 40d
    temperature: 1
    learn_proposal: true
    learn_proposal_Rminus1_max: 30
    learn_proposal_Rminus1_max_early: 30.0
    learn_proposal_Rminus1_min: 0.0
    max_samples: 100000
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.15
    Rminus1_cl_level: 0.95
    Rminus1_single_split: 4
    measure_speeds: true
    oversample_power: 0.4
    oversample_thin: true
    drag: false
    blocking:
    - - 1
      - - theta_i
        - log10_m_eV
        - C_agamma
    callback_function: null
    callback_every: null
    seed: null
    check_every: null
    oversample: null
    drag_limits: null
    fallback_covmat_scale: 4
    version: 3.6.1
output: alp
version: 3.6.1
