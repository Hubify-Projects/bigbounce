# Track A configuration: SMBH seed minimum mass analysis

cosmology:
  planck2018:
    H0: 67.4        # km/s/Mpc
    Omega_m: 0.315
    Omega_Lambda: 0.685
    label: "Planck 2018"

  framework:
    H0: 69.2         # km/s/Mpc
    Omega_m: 0.285   # adjusted for DNeff
    Omega_Lambda: 0.715
    Delta_Neff: 0.24
    sigma8: 0.785
    label: "Framework (spin-torsion)"

growth:
  epsilon_rad: 0.1      # radiative efficiency
  t_Edd_Gyr: 0.45       # Salpeter e-folding time [Gyr]
  f_duty_values:
    - 0.5
    - 0.7
    - 1.0

seed_channels:
  light:
    label: "Pop III remnants"
    mass_range_Msun: [10, 300]
    color: "#2196F3"
  medium:
    label: "Direct collapse (DCBH)"
    mass_range_Msun: [1.0e+4, 1.0e+5]
    color: "#FF9800"
  heavy:
    label: "Runaway mergers / PBH"
    mass_range_Msun: [1.0e+5, 1.0e+6]
    color: "#F44336"

z_seed_range:
  min: 12
  max: 30
  n_points: 200
